<!DOCTYPE html>
<html>
<head>

<title>CyberSecure Nexus</title>

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<link rel="stylesheet" href="/static/style.css">

</head>

<body>

<canvas id="bg"></canvas>

<div class="boot" id="boot">
INITIALIZING CYBERSECURE NEXUS...
</div>

<div class="container">

<header>
<h1>⚡ CYBERSECURE NEXUS</h1>
<div class="status">SYSTEM ONLINE</div>
</header>

<div class="grid">

<!-- LEFT PANEL -->
<div class="panel">

<h3>TARGET CONTROL</h3>

<input id="target"
placeholder="ENTER DOMAIN/IP">

<button onclick="startScan()">
LAUNCH RECON
</button>

<div class="radar"></div>

</div>

<!-- RIGHT PANEL -->
<div class="panel big">

<h3>LIVE TERMINAL</h3>
<div id="terminal"></div>

</div>

<!-- SYSTEM PANEL -->
<div class="panel">

<h3>SYSTEM STATUS</h3>

<p>CPU: ACTIVE</p>
<p>SCAN ENGINE: READY</p>
<p>NETWORK: SECURE</p>

</div>

</div>

</div>

<script src="/static/background.js"></script>
<script src="/static/ultra.js"></script>

</body>
</html>
<script src="/static/background.js"></script>
<script src="/static/ultra.js"></script>

</body>
</html>
